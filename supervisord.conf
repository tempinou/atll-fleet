[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

; Point d'entrée HTTP unique (port 8000 = httpPort du manifeste) : sert la
; console et proxifie l'API et le WebSocket.
[program:nginx]
command=/usr/sbin/nginx -c /app/code/nginx.conf -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; API Laravel servie par Octane/FrankenPHP, en local sur 8001.
[program:octane]
command=/usr/sbin/gosu www-data php artisan octane:frankenphp --host=127.0.0.1 --port=8001 --workers=4 --max-requests=500 --log-level=WARN
directory=/fleetbase/api
priority=20
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker de file d'attente (courriels, webhooks, traitements asynchrones).
[program:queue]
command=/usr/sbin/gosu www-data php artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/fleetbase/api
priority=30
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; SocketCluster : temps réel (positions, notifications), en local sur 38000.
[program:socketcluster]
command=/usr/bin/node /app/code/socketcluster/server.js
directory=/app/code/socketcluster
user=www-data
environment=ENV="production",SOCKETCLUSTER_PORT="38000",SOCKETCLUSTER_LOG_LEVEL="1"
priority=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
