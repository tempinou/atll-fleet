# nginx : point d'entrée unique du conteneur (port 8000).
#   /                       -> console Ember (SPA, repli sur index.html)
#   /int/, /v1/, /public/…  -> API Laravel (Octane/FrankenPHP sur 127.0.0.1:8001)
#   /socketcluster/         -> SocketCluster (WebSocket sur 127.0.0.1:38000)
#   /storage/               -> fichiers uploadés (disque "public" de Laravel)
#   /fleetbase.config.json  -> config runtime de la console (dans /app/data)
# Le système de fichiers est en lecture seule : pid, temporaires et logs
# vont dans /run ou sur stdout/stderr.

pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 600M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream fleetbase_api {
        server 127.0.0.1:8001;
    }

    upstream fleetbase_socket {
        server 127.0.0.1:38000;
    }

    server {
        listen 8000;
        server_name _;

        root /app/code/console;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Temps réel (WebSocket)
        location /socketcluster/ {
            proxy_pass http://fleetbase_socket;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API : préfixes enregistrés par core-api et les extensions serveur
        # (fleetops, storefront, pallet, ledger, ai, valhalla, vroom,
        # registry-bridge). Les routes de la SPA vivent sous /console/… et
        # /customer-portal/… (hors int|v1), donc pas de collision.
        location ~ ^/(int|v1|public|storefront|pallet|ledger|ai|valhalla|vroom|~registry)(/|$) {
            proxy_pass http://fleetbase_api;
        }

        location ~ ^/customer-portal/(int|v1)(/|$) {
            proxy_pass http://fleetbase_api;
        }

        # Fichiers uploadés (disque local "public")
        location /storage/ {
            alias /app/data/storage/app/public/;
            try_files $uri =404;
            expires 7d;
        }

        # Config runtime de la console, jamais mise en cache
        location = /fleetbase.config.json {
            alias /app/data/fleetbase.config.json;
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Assets fingerprintés de la console
        location ~ ^/(assets|engines-dist)/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            # Les tuiles OpenStreetMap exigent un Referer (voir aussi la balise meta
            # ajoutée à index.html, au cas où le proxy Cloudron remplace cet en-tête).
            add_header Referrer-Policy "strict-origin-when-cross-origin";
        }
    }
}
